<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Spending Report</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link th:href="@{/css/styles.css}" rel="stylesheet" type="text/css" >
</head>
<body>

<!-- Use the reusable header fragment -->
<div th:replace="~{headerFragment :: header('Monthly Spending Report')}"></div>

<section id="filter-options">
    <label for="year-filter">Select Year:</label>
    <select id="year-filter">
        <!-- Years will be populated dynamically by reportScript.js -->
    </select>

    <label for="month-filter">Select Month:</label>
    <select id="month-filter">
        <option value="ALL">ALL</option>
        <option value="JANUARY">JANUARY</option>
        <option value="FEBRUARY">FEBRUARY</option>
        <option value="MARCH">MARCH</option>
        <option value="APRIL">APRIL</option>
        <option value="MAY">MAY</option>
        <option value="JUNE">JUNE</option>
        <option value="JULY">JULY</option>
        <option value="AUGUST">AUGUST</option>
        <option value="SEPTEMBER">SEPTEMBER</option>
        <option value="OCTOBER">OCTOBER</option>
        <option value="NOVEMBER">NOVEMBER</option>
        <option value="DECEMBER">DECEMBER</option>
    </select>

    <label for="category-filter">Select Category:</label>
    <select id="category-filter">
        <option value="MAIN">Main</option>
        <option value="SUB">Sub</option>
    </select>

    <label for="spent-by-filter">Spent By:</label>
    <select id="spent-by-filter">
        <option value="USER">User</option>
        <option value="ALL">All</option>
    </select>
</section>

<section id="monthly-report">
    <!-- Report content will be dynamically updated -->
</section>
<!-- Added version query parameter to force cache refresh -->
<script th:src="@{/js/reportScript.js?v=2}"></script>
</body>
</html>
