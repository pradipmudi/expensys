<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet" type="text/css" >
</head>
<body>

<!-- Use the reusable header fragment -->
<div th:replace="~{headerFragment :: header('Expense Tracker')}"></div>

<section id="filter-options">
    <label for="year-filter">Select Year:</label>
    <select id="year-filter">
        <!-- Years will be populated dynamically by expenseByMonth.js -->
    </select>

    <label for="monthSelect">Select a Month:</label>
    <select id="monthSelect"></select>
</section>
    <!-- Add loading spinner -->
    <div id="loadingSpinner"></div>

    <!-- Add error message display -->
    <div id="errorMessage"></div>

    <!-- Pagination controls at the top -->
    <div id="paginationTop" style="text-align: center; margin: 20px 0;">
        <button>Previous</button>
        <span id="currentPageTop">1</span>
        <button>Next</button>
    </div>
    <div class="table-wrapper">
            <div class="transactions" id="transactionsContainer">
                <!-- Transactions will be dynamically added here -->
            </div>
    </div>
    <!-- Pagination controls at the bottom -->
    <div id="paginationBottom" style="text-align: center; margin-top: 20px;">
        <button>Previous</button>
        <span id="currentPageBottom">1</span>
        <button>Next</button>
    </div>

<!-- Added version query parameter to force cache refresh -->
<script th:src="@{/js/expenseByMonth.js?v=2}"></script>
</body>
</html>
