<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Expense Entry Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
            /* Removed flexbox to allow header to span full width */
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
            /* Center the container horizontally and add top margin */
            margin: 40px auto;
        }

        h1 {
            color: #3498db;
            font-size: 28px;
            margin-bottom: 20px;
        }

        form {
            text-align: left;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
            font-size: 18px;
        }

        input[type="date"],
        select,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        input[type="date"]:focus,
        select:focus,
        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
        }

        input[type="submit"] {
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s;
            width: 100%;
            margin-top: 20px;
        }

        input[type="submit"]:hover {
            background-color: #2980b9;
        }

        .select-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 100%;
            cursor: pointer;
            background-color: white;
        }

        .select-icon {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            pointer-events: none;
            color: #555;
        }
    </style>
</head>
<body>

<!-- Header is now outside the container for full width -->
<div th:replace="~{headerFragment :: header('Add Expense')}"></div>

<div class="container">
    <form id="expenseForm" action="/expense/save" method="post">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>

        <label for="item">Item:</label>
        <input type="text" id="item" name="item" placeholder="e.g., Weekly Groceries" required>

        <label for="subCategory">Category:</label>
        <div class="select-wrapper">
            <select id="subCategory" name="subCategory" required>
                <option value="" disabled selected>-- Select Category --</option>
                <!-- Options will be populated dynamically -->
            </select>
            <div class="select-icon">&#9660;</div>
        </div>

        <label for="spent">Spent (Amount):</label>
        <input type="number" id="spent" name="spent" step="0.01" placeholder="0.00" required>

        <label for="user">User (Spent By):</label>
        <input type="text" id="user" name="user" placeholder="Name" required>

        <input type="submit" value="Submit">
    </form>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Set Default Date to Today
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        // 2. Fetch Categories
        fetch('/category/all')
            .then(response => response.json())
            .then(categories => {
                const select = document.getElementById('subCategory');

                const emojiMap = {
                    'ENTERTAINMENT': '🎬',
                    'GROCERIES': '🛒',
                    'INVESTMENTS': '💼',
                    'LOSE_OF_MONEY': '💸',
                    'MEDICAL': '️💊',
                    'OUTSIDE_FOOD': '🍔',
                    'RENT_AND_OTHER_BILLS': '🏠',
                    'SALON_AND_COSMETICS': '💇‍♀️',
                    'SHOPPING': '🛍️',
                    'TRANSPORT': '🚗',
                    'VEGETABLES_FRUITS_DAIRY_AND_MEAT': '🥕🍏🥛🥩',
                    'OTHERS': '🌟'
                };

                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.key;
                    const emoji = emojiMap[cat.key] || '🏷️';
                    option.text = `${emoji} ${cat.label}`;
                    select.appendChild(option);
                });
            })
            .catch(error => console.error('Error fetching categories:', error));
    });

    document.getElementById("expenseForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const formData = new FormData(document.getElementById("expenseForm"));

        const newExpense = {
            date: formData.get("date"),
            item: formData.get("item"),
            category: formData.get("subCategory"),
            spent: parseFloat(formData.get("spent")),
            spentBy: formData.get("user")
        };

        fetch("/expense/save", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(newExpense)
        })
        .then(response => {
            if (response.status === 200) {
                alert("Expense saved successfully!");
                document.getElementById("expenseForm").reset();
                // Reset date to today after successful submission
                document.getElementById('date').value = new Date().toISOString().split('T')[0];
            } else {
                alert("Failed to save expense. Please try again.");
            }
        })
        .catch(error => {
            alert("An error occurred. Please try again.");
        });
    });
</script>
</body>
</html>
